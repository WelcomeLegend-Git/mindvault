name: Android CI & Automated Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 6 * * 1'

concurrency:
  group: android-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One failure must not cancel tests, lint, or the minified release check.
      fail-fast: false
      matrix:
        include:
          - check: Unit tests
            task: :app:testDebugUnitTest
            artifact: unit-tests
            configuration-cache: --configuration-cache
          - check: Android lint
            task: :app:lintDebug
            artifact: lint
            configuration-cache: --configuration-cache
          - check: Minified unsigned release
            task: :app:assembleRelease
            artifact: release
            configuration-cache: --configuration-cache
          - check: Resolved dependency vulnerabilities
            task: :app:exportDependencyInventory
            artifact: dependencies
            configuration-cache: --no-configuration-cache

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle cache and validate wrapper JARs
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      with:
        # Only trusted main pushes populate caches; PRs (including forks) read them.
        cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        validate-wrappers: true
        dependency-graph: disabled

    - name: Set up Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

    - name: Install Android SDK 36
      run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

    - name: Create build-only Firebase configuration
      shell: bash
      run: |
        # Deliberately invalid credentials; no secrets or live authentication.
        # Includes a dummy web client ID for generated default_web_client_id.
        cat > app/google-services.json <<'JSON'
        {
          "project_info": {
            "project_number": "123456789012",
            "project_id": "demo-mindvault-ci",
            "storage_bucket": "demo-mindvault-ci.invalid"
          },
          "client": [{
            "client_info": {
              "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
              "android_client_info": { "package_name": "com.example.mindvault" }
            },
            "oauth_client": [{
              "client_id": "ci-only-not-a-live-client.apps.googleusercontent.com",
              "client_type": 3
            }],
            "api_key": [{ "current_key": "CI_ONLY_INVALID_API_KEY_DO_NOT_USE" }],
            "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
          }],
          "configuration_version": "1"
        }
        JSON

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run ${{ matrix.check }}
      # No instrumentation, live auth, signing credentials, or distribution upload.
      env:
        GRADLE_TASK: ${{ matrix.task }}
        CONFIGURATION_CACHE: ${{ matrix.configuration-cache }}
      run: ./gradlew "$GRADLE_TASK" "$CONFIGURATION_CACHE" --continue --no-daemon --build-cache

    - name: Test the vulnerability checker (offline)
      if: matrix.artifact == 'dependencies'
      run: node --test .github/scripts/osv-scan.test.mjs

    - name: Check resolved Maven versions against OSV
      if: matrix.artifact == 'dependencies'
      run: node .github/scripts/osv-scan.mjs app/build/reports/dependencies/maven-inventory.txt app/build/reports/dependencies/osv.json

    - name: Upload check reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: android-${{ matrix.artifact }}-reports
        path: |
          app/build/reports/
          app/build/test-results/testDebugUnitTest/
        if-no-files-found: warn
        retention-days: 7

  dependency-review:
    name: Dependency review (GitHub graph)
    if: github.event_name == 'pull_request' && (github.event.repository.private == false || vars.DEPENDENCY_REVIEW_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review graph-visible dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never
